name: Diagnose CAD360 Undo State v4.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-clipboard-entitystore-v4.yml'

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Create diagnostic test
        shell: pwsh
        run: |
          @'
          use cadcraft_engine::Session;
          use serde_json::json;
          fn circle(s:&mut Session,x:f64){s.execute("circle",&json!({"center":[x,0],"radius":1})).unwrap();}
          fn dump(s:&Session,label:&str){
              let st=s.state().unwrap();
              eprintln!("DIAG {label}: undo={} redo={} marks={:?} group={:?} ctl={:?} entities={}",st.undo.len(),st.redo.len(),st.undo_ctl.marks,st.undo_ctl.group,st.undo_ctl.control,st.doc.model.len());
          }
          #[test] fn mark_back(){
              let mut s=Session::new(); dump(&s,"start");
              s.cmdline("undo m").unwrap(); dump(&s,"mark1");
              circle(&mut s,0.0); dump(&s,"circle0");
              s.cmdline("undo m").unwrap(); dump(&s,"mark2");
              circle(&mut s,2.0); dump(&s,"circle2");
              s.execute("u",&json!({})).unwrap(); dump(&s,"u1");
              s.execute("u",&json!({})).unwrap(); dump(&s,"u2");
              circle(&mut s,3.0); dump(&s,"circle3");
          }
          #[test] fn control(){
              let mut s=Session::new(); dump(&s,"c-start");
              circle(&mut s,0.0); dump(&s,"c0");
              s.execute("undo",&json!({"mode":"control","control":"none"})).unwrap(); dump(&s,"none");
              circle(&mut s,2.0); dump(&s,"c2-none");
              s.cmdline("undo one").unwrap(); dump(&s,"one");
              circle(&mut s,4.0); dump(&s,"c4");
              circle(&mut s,6.0); dump(&s,"c6");
              s.cmdline("undo 5").unwrap(); dump(&s,"undo5");
              s.cmdline("undo c a").unwrap(); dump(&s,"all");
              circle(&mut s,8.0); dump(&s,"c8");
              circle(&mut s,10.0); dump(&s,"c10");
          }
          #[test] fn group_script(){
              let mut s=Session::new(); dump(&s,"g-start");
              s.script("UNDO BE\nCIRCLE 0,0 1\nUNDO BE\nCIRCLE 3,0 1\nCIRCLE 6,0 1\nUNDO E\n").unwrap();
              dump(&s,"after-script");
          }
          '@ | Set-Content SOURCE_CAD_R65/crates/engine/tests/diag_undo.rs -Encoding utf8
      - name: Run diagnostic
        shell: pwsh
        working-directory: SOURCE_CAD_R65
        run: cargo test --locked -p cadcraft-engine --test diag_undo -- --nocapture --test-threads=1
